name: SpecForge CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validate-and-test:
    name: Build & Verify Production Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma ORM Client
        run: npx prisma generate

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Execute Master Launch-Readiness Verification
        run: node scratch/verify-launch-readiness-master.mjs

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

